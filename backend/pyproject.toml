[project]
name = "ase"
version = "0.1.0"
description = "The All Seeing Eye: OSINT fusion backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.20.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.14.0",
    "structlog>=24.4",
    "typer>=0.12",
    "sse-starlette>=3.4.11",
    "httpx>=0.28.1",
    "websockets>=17.1,<18",
    "defusedxml>=0.7.1",
    "cryptography>=43",
    "sgp4>=2.27",
    "py3langid>=0.4.0",
    "pyotp>=2.9.0",
    "reportlab>=4.4",
    "python-docx>=1.2",
    "pypdf>=6.19.0",
    "pillow>=12.3.0",
    "tzdata>=2026.4",
    "shapely>=2.1.2,<3",
    "proplib-lfmf==1.1.0",
]

[project.scripts]
ase = "ase.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.16.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "import-linter>=2.1",
    "types-defusedxml>=0.7.0.20260504",
    "pytest-timeout>=2.4.0",
    "types-reportlab>=5.0.0.20260911",
    "fonttools==4.65.0",
    "types-shapely>=2.1.0.20260728",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ase"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
addopts = "--cov=ase --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio bridge runs ORM code in greenlets; without this, lines after an
# awaited query are silently missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "aiosqlite.*", "py3langid.*", "sgp4", "sgp4.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "C4", "T20", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"alembic/**" = ["E501"]
# Audit action names such as "password_set" are event labels, not credentials.
"src/ase/domain/audit.py" = ["S105"]

[tool.bandit]
# B101: asserts here only narrow types after exhaustive branches. B105: audit action names
# and HTTP status codes are not credentials; ruff's S105 still guards real string secrets.
skips = ["B101", "B105"]

[tool.importlinter]
root_package = "ase"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "ase.cli",
    "ase.main",
    "ase.app_factory",
    "ase.app_lifecycle",
    "ase.api",
    "ase.container",
    "ase.adapters | ase.infrastructure",
    "ase.application",
    "ase.domain",
]

[[tool.importlinter.contracts]]
name = "Core layers are framework free"
type = "forbidden"
source_modules = ["ase.domain", "ase.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "structlog",
    "argon2",
    "jwt",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "HTTP transport does not import persistence adapters"
type = "forbidden"
source_modules = ["ase.api"]
forbidden_modules = ["ase.adapters.persistence"]
# Transport reaches persistence through composition-root factories, never by
# importing an implementation. Existing subscription read projections are the
# remaining explicit exceptions; unmatched entries fail so this list must shrink.
allow_indirect_imports = true
ignore_imports = [
    "ase.api.routers.admin_subscription_diagnostics -> ase.adapters.persistence.subscription_diagnostics",
    "ase.api.routers.subscription_usage -> ase.adapters.persistence.monthly_report_usage",
    "ase.api.routers.schedules -> ase.adapters.persistence.subscription_briefs",
    "ase.api.routers.schedules -> ase.adapters.persistence.subscription_comparisons",
    "ase.api.routers.schedules -> ase.adapters.persistence.subscription_editions",
]
