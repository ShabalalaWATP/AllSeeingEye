# Run with `uvx pre-commit run --all-files` (or install pre-commit and `pre-commit install`).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: file-length
        name: file length (warn at 350 lines, fail at 400)
        entry: python scripts/check_file_length.py
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-typecheck
        name: frontend typecheck
        entry: pnpm --dir frontend typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
