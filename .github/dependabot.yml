version: 2
# Minor and patch updates arrive as one pull request per ecosystem, so a weekly run
# costs one full CI run each rather than one per package. Major updates stay separate
# because they are the ones that need individual review.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # React packages move together at every version level; listed first so they win.
      react-runtime:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Vitest 5.0.2's jsdom environment reads jsdom's private Blob internals, which
      # jsdom 30 removed, so every binary upload test fails. Lift once Vitest supports it.
      # Review by 2026-11.
      - dependency-name: jsdom
        versions: ['>=30.0.0']
  - package-ecosystem: gomod
    directory: /infra/caddy-build
    schedule:
      interval: weekly
    ignore:
      # Caddy 2.11.4's CEL matcher does not compile against cel-go 0.29 or later
      # (Interpretable became InterpretableV2). Remove once Caddy supports it.
      # Review by 2026-11.
      - dependency-name: github.com/google/cel-go
        versions: ['>=0.29.0']
    groups:
      go-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # CI tests the backend on Python 3.13; move the image and CI together, deliberately.
      # Review by 2026-11.
      - dependency-name: python
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      backend-images-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Move Node with CI's node-version, LTS releases only. Review by 2026-11.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # Review the Caddy toolchain before a Go major upgrade. Review by 2026-11.
      - dependency-name: golang
        update-types: ['version-update:semver-major']
    groups:
      frontend-images-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  # The production database base image. CI's PostgreSQL service pins the same image
  # (scripts/tests/test_database_image_pin.py keeps them equal), so update both
  # together when this pull request arrives, then roll the database out by hand.
  - package-ecosystem: docker
    directory: /infra/postgis
    schedule:
      interval: weekly
    ignore:
      # A PostgreSQL major upgrade needs a dump and restore, never an image bump.
      - dependency-name: postgis/postgis
        update-types: ['version-update:semver-major']
