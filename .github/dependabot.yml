version: 2
# Minor and patch updates arrive as one pull request per ecosystem, so a weekly run
# costs one full CI run each rather than one per package. Major updates stay separate
# because they are the ones that need individual review.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # React packages move together at every version level; listed first so they win.
      react-runtime:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /infra/caddy-build
    schedule:
      interval: weekly
    ignore:
      # Caddy 2.11.4's CEL matcher does not compile against cel-go 0.29 or later
      # (Interpretable became InterpretableV2). Remove once Caddy supports it.
      - dependency-name: github.com/google/cel-go
        versions: ['>=0.29.0']
    groups:
      go-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # CI tests the backend on Python 3.13; move the image and CI together, deliberately.
      - dependency-name: python
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      backend-images-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-images-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
