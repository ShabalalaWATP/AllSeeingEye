name: Image SBOMs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    # Inventory availability must not block a merge or the main CI workflow.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
            dockerfile: backend/Dockerfile
          - image: web
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image being inventoried
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "ase-$IMAGE:sbom" -f "$DOCKERFILE" "$CONTEXT"
      - name: Inventory OS and application packages
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ase-${{ matrix.image }}:sbom
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check the inventory and record the image identity
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          python -c 'import json, os; d=json.load(open("sbom-"+os.environ["IMAGE"]+".cdx.json")); assert d["bomFormat"] == "CycloneDX" and d["specVersion"] and d["components"]'
          docker image inspect "ase-$IMAGE:sbom" > "image-$IMAGE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-${{ matrix.image }}-${{ github.sha }}
          path: |
            sbom-${{ matrix.image }}.cdx.json
            image-${{ matrix.image }}.json
          retention-days: 90
          if-no-files-found: error
      - name: Report missing inventory
        if: failure()
        run: echo 'Image inventory failed. Inspect this advisory job before relying on its SBOM.' >> "$GITHUB_STEP_SUMMARY"
