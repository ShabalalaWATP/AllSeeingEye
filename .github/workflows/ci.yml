name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag is kept as a comment).
jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports
      - name: Require the committed OpenAPI schema to match the backend
        run: |
          uv run ase export-openapi ../frontend/src/lib/api/openapi.json
          git diff --exit-code -- ../frontend/src/lib/api/openapi.json

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv python install 3.13
      - run: uv sync --frozen
      # Each xdist worker has a private in-memory SQLite database; pytest-cov combines
      # the workers' data into the shard's coverage file.
      - run: uv run python ../scripts/run_test_shard.py ${{ matrix.shard }} 8 --workers auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sqlite-coverage-${{ matrix.shard }}
          path: backend/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
        env:
          POSTGRES_USER: ase
          POSTGRES_PASSWORD: ase
          POSTGRES_DB: ase
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2147483648
          --health-cmd "pg_isready -U ase -d ase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ASE_TEST_DATABASE_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Require PostgreSQL transaction durability settings
        env:
          PGPASSWORD: ase
        run: |
          durability=$(psql --host localhost --username ase --dbname ase \
            --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --command "SELECT current_setting('fsync') = 'on' AND current_setting('synchronous_commit') = 'on' AND current_setting('full_page_writes') = 'on'")
          test "$durability" = t
          psql --host localhost --username ase --dbname ase --set ON_ERROR_STOP=1 \
            --command "SELECT name, setting, unit FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes', 'max_wal_size', 'min_wal_size', 'checkpoint_timeout', 'checkpoint_completion_target', 'wal_level', 'wal_segment_size', 'shared_buffers') ORDER BY name"
      - name: Database tests in private worker databases
        # The two-worker trial was slower; retain automatic worker selection.
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          sample_storage() {
            local sleeper=
            # The signal trap invokes this function indirectly.
            # shellcheck disable=SC2317
            stop_sample() {
              if [ -n "$sleeper" ]; then
                kill "$sleeper" 2>/dev/null || true
                wait "$sleeper" 2>/dev/null || true
              fi
              exit 0
            }
            trap stop_sample TERM INT
            while true; do
              date --utc --iso-8601=seconds
              # PGDATA is expanded inside the container.
              # shellcheck disable=SC2016
              timeout 10s docker exec "$POSTGRES_CONTAINER_ID" sh -c \
                'df -k "$PGDATA"; df -i "$PGDATA"; du -sk "$PGDATA/base" "$PGDATA/pg_wal"' \
                || printf '%s\n' 'Storage sample unavailable or changed during scan; retrying.'
              sleep 30 &
              sleeper=$!
              wait "$sleeper" || true
              sleeper=
            done
          }
          sample_storage >postgres-capacity-parallel.log 2>&1 &
          sampler_pid=$!
          finish() {
            test_status=$?
            trap - EXIT
            kill "$sampler_pid" 2>/dev/null || true
            wait "$sampler_pid" 2>/dev/null || true
            exit "$test_status"
          }
          trap finish EXIT
          uv run python ../scripts/run_test_shard.py ${{ matrix.shard }} 4 --postgres-mode parallel --workers auto --template-postgres
      - name: Provision disposable legacy migration database
        env:
          PGPASSWORD: ase
        run: psql --host localhost --username ase --dbname ase --command 'CREATE DATABASE ase_s01_disposable_ci'
      - name: Serial PostgreSQL, race and migration tests
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          ASE_TOKEN_RACE_TEST_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_COMPARISON_CONCURRENCY_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_MONITOR_CONCURRENCY_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_MONITOR_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_NOTIFICATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_NOTIFICATION_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_IDENTITY_CONCURRENCY_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_FIRMS_CONCURRENCY_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_FIRMS_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_LLM_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_RELATIONSHIP_CONCURRENCY_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_RELATIONSHIP_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_SCOPE_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_TEAMS_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
          ASE_TEST_MIGRATION_POSTGRES_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase_s01_disposable_ci
        run: |
          sample_storage() {
            local sleeper=
            # The signal trap invokes this function indirectly.
            # shellcheck disable=SC2317
            stop_sample() {
              if [ -n "$sleeper" ]; then
                kill "$sleeper" 2>/dev/null || true
                wait "$sleeper" 2>/dev/null || true
              fi
              exit 0
            }
            trap stop_sample TERM INT
            while true; do
              date --utc --iso-8601=seconds
              # PGDATA is expanded inside the container.
              # shellcheck disable=SC2016
              timeout 10s docker exec "$POSTGRES_CONTAINER_ID" sh -c \
                'df -k "$PGDATA"; df -i "$PGDATA"; du -sk "$PGDATA/base" "$PGDATA/pg_wal"' \
                || printf '%s\n' 'Storage sample unavailable or changed during scan; retrying.'
              sleep 30 &
              sleeper=$!
              wait "$sleeper" || true
              sleeper=
            done
          }
          sample_storage >postgres-capacity-serial.log 2>&1 &
          sampler_pid=$!
          finish() {
            test_status=$?
            trap - EXIT
            kill "$sampler_pid" 2>/dev/null || true
            wait "$sampler_pid" 2>/dev/null || true
            exit "$test_status"
          }
          trap finish EXIT
          uv run python ../scripts/run_test_shard.py ${{ matrix.shard }} 4 --postgres-mode serial
      - name: Retain PostgreSQL capacity samples
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-capacity-${{ matrix.shard }}
          path: backend/postgres-capacity-*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-coverage-${{ matrix.shard }}
          path: |
            backend/.coverage.*
            backend/.test-nodeids.postgres-*.txt
          include-hidden-files: true
          if-no-files-found: error

  backend:
    needs: [backend-quality, backend-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful quality checks and every test shard
        env:
          QUALITY_RESULT: ${{ needs.backend-quality.result }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv python install 3.13
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sqlite-coverage-*
          path: backend
          merge-multiple: true
      - run: uv sync --frozen
        working-directory: backend
      - name: Verify complete SQLite coverage
        run: for shard in {0..7}; do test -f "backend/.coverage.shard-$shard" || exit 1; done
      - run: uv run coverage combine
        working-directory: backend
      - run: uv run coverage report --fail-under=90
        working-directory: backend
      - run: uv run coverage json -o coverage-sqlite.json
        working-directory: backend
      - name: Require security modules to meet the reviewed 95 percent floors
        run: uv run python ../scripts/check_coverage_floors.py coverage-sqlite.json --policy backend-security
        working-directory: backend

  backend-postgres:
    needs: postgres-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every PostgreSQL test shard
        env:
          TEST_RESULT: ${{ needs.postgres-tests.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv python install 3.13
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: postgres-coverage-*
          path: backend
          merge-multiple: true
      - run: uv sync --frozen
        working-directory: backend
      - name: Verify complete PostgreSQL coverage
        run: for shard in {0..3}; do for mode in parallel serial; do test -f "backend/.coverage.shard-$shard-$mode" || exit 1; done; done
      - run: uv run coverage combine
        working-directory: backend
      - run: uv run coverage report --fail-under=0
        working-directory: backend

      - run: uv run coverage json -o coverage-postgres.json
        working-directory: backend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-coverage-report
          path: backend/coverage-postgres.json
          if-no-files-found: error

  frontend-ci:
    uses: ./.github/workflows/frontend.yml

  # Keep the protected frontend check identity stable for existing branch rules.
  frontend:
    needs: frontend-ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend checks, shards and merged coverage
        env:
          FRONTEND_RESULT: ${{ needs.frontend-ci.result }}
        run: test "$FRONTEND_RESULT" = success

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.13
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pip-audit
        working-directory: backend
      - run: uv run bandit -r src -q -c pyproject.toml
        working-directory: backend
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level high
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    permissions:
      contents: read
    outputs:
      sarif: ${{ steps.sarif.outcome }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The application requires Python >=3.13; Python 3.7 compatibility is inapplicable.
      - run: semgrep scan --config p/default --config p/security-audit --exclude-rule python.lang.compatibility.python37.python37-compatibility-importlib2 --no-rewrite-rule-ids --error --sarif --output semgrep.sarif backend/src frontend/src
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: sarif
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error

  # Publishing runs outside the Semgrep container. Inside it the checkout has no usable
  # git context, so upload-sarif cannot tell which commit it is describing and code
  # scanning waits forever for a report it never associates, blocking the merge.
  semgrep-publish:
    needs: semgrep
    if: ${{ !cancelled() && needs.semgrep.outputs.sarif == 'success' }}
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: semgrep-sarif
      # On pull requests, attribute results to the head commit as CodeQL does. GitHub
      # regenerates the test merge commit, so results tied to it can go stale and leave
      # the code scanning merge rule waiting for Semgrep indefinitely.
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  image-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
            dockerfile: backend/Dockerfile
            build_args: ''
          - image: web
            context: .
            dockerfile: frontend/Dockerfile
            build_args: BUILD_COMMAND=build:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: ase-${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
      - name: Smoke-test the web image's static serving
        if: matrix.image == 'web'
        run: |
          docker run -d --name ase-web-smoke -p 127.0.0.1:8080:8080 \
            -e ASE_SITE_ADDRESS=http://localhost:8080 ase-web:ci
          for _attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          python3 scripts/check_web_image.py http://localhost:8080 || {
            docker logs ase-web-smoke; exit 1; }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ase-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  images:
    needs: [image-builds]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both image builds and security scans
        env:
          IMAGE_RESULT: ${{ needs.image-builds.result }}
        run: test "$IMAGE_RESULT" = success

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/check_file_length.py
      - run: python -m unittest discover -s scripts/tests -v
