name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the tag is kept as a comment).
jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports
      - name: Require the committed OpenAPI schema to match the backend
        run: |
          uv run ase export-openapi ../frontend/src/lib/api/openapi.json
          git diff --exit-code -- ../frontend/src/lib/api/openapi.json

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run python ../scripts/run_test_shard.py ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqlite-coverage-${{ matrix.shard }}
          path: backend/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
        env:
          POSTGRES_USER: ase
          POSTGRES_PASSWORD: ase
          POSTGRES_DB: ase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ase -d ase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ASE_TEST_DATABASE_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
      ASE_TOKEN_RACE_TEST_URL: postgresql+asyncpg://ase:ase@localhost:5432/ase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run python ../scripts/run_test_shard.py ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-coverage-${{ matrix.shard }}
          path: backend/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  backend:
    needs: [backend-quality, backend-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful quality checks and every test shard
        env:
          QUALITY_RESULT: ${{ needs.backend-quality.result }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv python install 3.13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sqlite-coverage-*
          path: backend
          merge-multiple: true
      - run: uv sync --frozen
        working-directory: backend
      - name: Verify complete SQLite coverage
        run: for shard in {0..7}; do test -f "backend/.coverage.shard-$shard" || exit 1; done
      - run: uv run coverage combine
        working-directory: backend
      - run: uv run coverage report --fail-under=90
        working-directory: backend

  backend-postgres:
    needs: postgres-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every PostgreSQL test shard
        env:
          TEST_RESULT: ${{ needs.postgres-tests.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv python install 3.13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: postgres-coverage-*
          path: backend
          merge-multiple: true
      - run: uv sync --frozen
        working-directory: backend
      - name: Verify complete PostgreSQL coverage
        run: for shard in {0..7}; do test -f "backend/.coverage.shard-$shard" || exit 1; done
      - run: uv run coverage combine
        working-directory: backend
      - run: uv run coverage report --fail-under=90
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require generated API types to match the committed schema
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/types.gen.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.13
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pip-audit
        working-directory: backend
      - run: uv run bandit -r src -q -c pyproject.toml
        working-directory: backend
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level high
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    permissions:
      contents: read
    outputs:
      sarif: ${{ steps.sarif.outcome }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The application requires Python >=3.13; Python 3.7 compatibility is inapplicable.
      - run: semgrep scan --config p/default --config p/security-audit --exclude-rule python.lang.compatibility.python37.python37-compatibility-importlib2 --no-rewrite-rule-ids --error --sarif --output semgrep.sarif backend/src frontend/src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: sarif
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error

  # Publishing runs outside the Semgrep container. Inside it the checkout has no usable
  # git context, so upload-sarif cannot tell which commit it is describing and code
  # scanning waits forever for a report it never associates, blocking the merge.
  semgrep-publish:
    needs: semgrep
    if: ${{ !cancelled() && needs.semgrep.outputs.sarif == 'success' }}
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: semgrep-sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ase-api:ci ./backend
      - run: docker build -t ase-web:ci -f frontend/Dockerfile .
      - name: Smoke-test the web image's static serving
        run: |
          docker run -d --name ase-web-smoke -p 127.0.0.1:8080:8080 \
            -e ASE_SITE_ADDRESS=http://localhost:8080 ase-web:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          python3 scripts/check_web_image.py http://localhost:8080 || {
            docker logs ase-web-smoke; exit 1; }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ase-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ase-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/check_file_length.py
      - run: python -m unittest discover -s scripts/tests -v
