name: Uptime

# Probes the public deployment from outside. A failed run is the alert: GitHub
# notifies the account that owns this schedule. GitHub pauses schedules after 60
# days without repository activity; re-enable the workflow if that happens.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'ShabalalaWATP/AllSeeingEye'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: allseeingeyeosint.com
      CERT_WARN_DAYS: "14"
    steps:
      - name: Check the site, API health and readiness
        run: |
          probe() {
            local path="$1" expect="$2"
            for attempt in 1 2 3; do
              body=$(curl --silent --show-error --fail --max-time 15 "https://$HOST$path") \
                && grep -q -- "$expect" <<<"$body" && { echo "ok   $path"; return 0; }
              sleep 20
            done
            echo "::error title=Uptime::$path did not answer as expected after three attempts"
            return 1
          }
          status=0
          probe / '<div id="root">' || status=1
          probe /api/health '"status":"ok"' || status=1
          probe /api/ready '"status":"ready"' || status=1
          exit $status
      - name: Check the TLS certificate is not about to expire
        run: |
          end=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ($(date -d "$end" +%s) - $(date +%s)) / 86400 ))
          echo "Certificate expires $end ($days days)."
          if [ "$days" -lt "$CERT_WARN_DAYS" ]; then
            echo "::error title=Uptime::TLS certificate expires in $days days; check Caddy renewal"
            exit 1
          fi
