name: Database image

# The PostGIS image is a third-party base we pin by digest in docker-compose.yml and
# in CI's PostgreSQL service. Dependabot proposes updates (see dependabot.yml); this
# workflow scans the pinned image weekly and whenever the pin changes, so a fixable
# HIGH or CRITICAL vulnerability turns this workflow red without blocking unrelated
# pull requests or deploys.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [docker-compose.yml, .github/workflows/database-image.yml]
  push:
    branches: [main]
    paths: [docker-compose.yml, .github/workflows/database-image.yml]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned database image
        id: pin
        run: |
          image=$(awk '/^  db:/{in_db=1} in_db && /image:/{print $2; exit}' docker-compose.yml)
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
