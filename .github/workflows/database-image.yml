name: Database image

# The database image (infra/postgis/Dockerfile) is the digest-pinned upstream PostGIS
# image with current Alpine security updates applied. Dependabot proposes base updates
# (see dependabot.yml); this workflow builds the image and scans it weekly and whenever
# it changes, so a fixable HIGH or CRITICAL vulnerability turns this workflow red
# without blocking unrelated pull requests or deploys. A red weekly run with no
# repository change means the base needs updating; a production database built some
# time ago may also be due a rebuild (docs/DEPLOYMENT.md).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [infra/postgis/**, docker-compose.yml, .github/workflows/database-image.yml]
  push:
    branches: [main]
    paths: [infra/postgis/**, docker-compose.yml, .github/workflows/database-image.yml]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the database image
        run: docker build --pull -t ase-db:scan infra/postgis
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ase-db:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
