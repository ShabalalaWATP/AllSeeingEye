# Bounded json-file logs, matching the reference VPS daemon settings, so an install
# without host-level rotation cannot fill its disk with container output.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Memory and process limits stop one runaway service from starving the others on a
# single host. They sit at two to six times the peaks measured in production in
# September 2026 (API 1.0 GB, database 0.35 GB, web 0.04 GB); raise them if a real
# workload needs more.
services:
  db:
    image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ase}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ase} -d ${POSTGRES_DB:-ase}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    pids_limit: 256
    logging: *logging
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      ASE_ENV: prod
      ASE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ase}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ase}
      ASE_PUBLIC_BASE_URL: ${ASE_PUBLIC_BASE_URL:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - parser_socket:/run/ase-parser:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 3g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  parser:
    build: ./backend
    command: ["python", "-I", "-m", "ase.adapters.research_imports.service"]
    network_mode: none
    user: "10001:10001"
    volumes:
      - parser_socket:/run/ase-parser
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=134217728
    mem_limit: 768m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/ase-parser/parser.sock'); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      ASE_SITE_ADDRESS: ${ASE_SITE_ADDRESS:-localhost}
      ASE_TLS: ${ASE_TLS:-internal}
      ASE_HSTS_MAX_AGE: ${ASE_HSTS_MAX_AGE:-0}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  parser_socket:
