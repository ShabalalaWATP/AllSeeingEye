services:
  db:
    image: postgis/postgis:16-3.4-alpine@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ase}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ase} -d ${POSTGRES_DB:-ase}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      ASE_ENV: prod
      ASE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ase}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ase}
      ASE_PUBLIC_BASE_URL: ${ASE_PUBLIC_BASE_URL:-https://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      ASE_SITE_ADDRESS: ${ASE_SITE_ADDRESS:-localhost}
      ASE_TLS: ${ASE_TLS:-internal}
      ASE_HSTS_MAX_AGE: ${ASE_HSTS_MAX_AGE:-0}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
